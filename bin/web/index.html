<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeckCast</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f17; color: #e8eef7; font-family: system-ui, sans-serif; }
  header { padding: 14px 16px; font-weight: 600; font-size: 18px; background: #131a26; }
  .wrap { padding: 12px 16px 28px; }
  video { width: 100%; background: #000; border-radius: 12px; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  label { font-size: 13px; opacity: .8; }
  input[type=range] { flex: 1; min-width: 160px; }
  input[type=text] { flex: 1; min-width: 180px; padding: 11px 12px; border-radius: 9px;
                     border: 1px solid #283549; background: #0e1622; color: #e8eef7; font-size: 15px; }
  .btn { background: #2563eb; border: none; color: #fff; padding: 11px 16px;
         border-radius: 9px; font-size: 15px; font-weight: 600; }
  .btn:active { background: #1d4ed8; }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .vid { background: #1b2536; border: 1px solid #283549; color: #e8eef7;
         padding: 12px 14px; border-radius: 10px; text-align: left; font-size: 15px; }
  .vid:active { background: #243248; }
  .sec { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .5; margin: 18px 0 6px; }
  .hint { opacity: .6; font-size: 13px; margin-top: 10px; }
  #status { font-size: 13px; opacity: .85; margin-top: 6px; }
</style>
</head>
<body>
<header>📺 DeckCast — второй экран</header>
<div class="wrap">

  <video id="player" controls playsinline muted></video>

  <div class="row">
    <label>Синхрон звука: <span id="dval">1500</span> мс</label>
    <input id="delay" type="range" min="0" max="4000" step="100" value="1500">
  </div>
  <div id="status">Вставь ссылку или выбери видео 👇</div>

  <div class="sec">Ссылка (YouTube и т.п.)</div>
  <div class="row">
    <input id="url" type="text" inputmode="url" placeholder="https://youtube.com/watch?v=...">
    <button class="btn" id="playUrl">▶ Играть</button>
  </div>

  <div class="sec">Файлы из папки Деки</div>
  <div class="list" id="list"></div>

  <div class="hint">Звук идёт в наушники Steam Deck. Двигай ползунок, если звук и картинка
  расходятся (больше = звук позже).</div>
</div>

<script src="mpegts.js"></script>
<script>
const player  = document.getElementById('player');
const listEl  = document.getElementById('list');
const status  = document.getElementById('status');
const delayEl = document.getElementById('delay');
const dval    = document.getElementById('dval');
const urlEl   = document.getElementById('url');
let current   = null;   // { file } или { url } — что играет сейчас
let mp        = null;

delayEl.addEventListener('input', () => { dval.textContent = delayEl.value; });
delayEl.addEventListener('change', () => { if (current) playSource(current); });
document.getElementById('playUrl').addEventListener('click', () => {
  const u = urlEl.value.trim();
  if (u) playSource({ url: u });
});

function playSource(src) {
  current = src;
  const human = src.url ? 'ссылку' : src.file;
  status.textContent = 'Загрузка: ' + human;
  if (mp) { mp.destroy(); mp = null; }
  if (!window.mpegts || !mpegts.isSupported()) {
    status.textContent = 'Браузер не поддерживает поток (нужен Chrome на Android).';
    return;
  }
  let q = 'delay=' + delayEl.value;
  if (src.url) q += '&url=' + encodeURIComponent(src.url);
  else q += '&file=' + encodeURIComponent(src.file);

  mp = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: '/stream?' + q },
                           { liveBufferLatencyChasing: true, liveSync: true });
  mp.attachMediaElement(player);
  mp.on(mpegts.Events.ERROR, () => status.textContent = 'Ошибка потока. Ссылка/файл верные? Есть ли yt-dlp на Деке?');
  mp.load();
  mp.play().then(() => status.textContent = '▶ ' + human).catch(()=>{});
}

async function loadList() {
  try {
    const r = await fetch('/list');
    const j = await r.json();
    listEl.innerHTML = '';
    if (!j.videos.length) {
      listEl.innerHTML = '<div class="hint">Папка пуста. Положи файлы в ~/Videos на Деке.</div>';
      return;
    }
    for (const name of j.videos) {
      const b = document.createElement('button');
      b.className = 'vid';
      b.textContent = '🎬 ' + name;
      b.onclick = () => playSource({ file: name });
      listEl.appendChild(b);
    }
  } catch (e) {
    status.textContent = 'Не удалось получить список видео.';
  }
}
loadList();
</script>
</body>
</html>
