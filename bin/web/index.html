<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeckCast</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f17; color: #e8eef7; font-family: system-ui, sans-serif; }
  header { padding: 13px 16px; font-weight: 600; font-size: 17px; background: #131a26;
           position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; }
  header select { background: #0e1622; color: #e8eef7; border: 1px solid #283549;
                  border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .wrap { padding: 10px 14px 32px; }
  video { width: 100%; background: #000; border-radius: 12px; display: block; margin-top: 4px; }

  .sync { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 13px; }
  .sync label { opacity: .8; }
  .sync .val { font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
  .nudge { background: #1b2536; border: 1px solid #283549; color: #e8eef7;
           padding: 7px 10px; border-radius: 8px; font-size: 13px; }
  .nudge:active { background: #243248; }
  input[type=range] { width: 100%; accent-color: #2563eb; }

  .search { display: flex; gap: 8px; margin: 6px 0; }
  .search input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #283549;
                  background: #0e1622; color: #e8eef7; font-size: 15px; }
  .btn { background: #2563eb; border: none; color: #fff; padding: 12px 16px;
         border-radius: 10px; font-size: 15px; font-weight: 600; flex: none; }
  .btn:active { background: #1d4ed8; }
  .btn[disabled] { opacity: .5; }

  .card { display: flex; gap: 10px; padding: 8px; border-radius: 10px; background: #141d2b;
          border: 1px solid #1f2a3c; margin-bottom: 8px; align-items: center; }
  .card:active { background: #1b2740; }
  .card img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background:#000; }
  .card .meta { min-width: 0; }
  .card .t { font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
             -webkit-box-orient: vertical; overflow: hidden; }
  .card .c { font-size: 12px; opacity: .6; margin-top: 3px; }

  .sec { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .5; margin: 18px 0 8px; }
  .hint { opacity: .55; font-size: 12px; margin-top: 6px; }
  #status { font-size: 13px; opacity: .85; margin: 6px 0; min-height: 18px; }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid #2563eb; border-top-color:transparent;
          border-radius:50%; animation: sp .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  details summary { cursor: pointer; opacity: .7; font-size: 13px; margin: 14px 0 6px; }
</style>
</head>
<body>
<header>
  <span>📺 DeckCast</span>
  <label style="font-size:12px;opacity:.8">Качество
    <select id="q">
      <option value="0">Авто</option>
      <option value="1080">1080p</option>
      <option value="720" selected>720p</option>
      <option value="480">480p</option>
    </select>
  </label>
</header>
<div class="wrap">

  <video id="player" controls playsinline></video>
  <div id="status">Найди видео или вставь ссылку 👇</div>

  <!-- Синхрон звука: кнопки точной подгонки + ползунок -->
  <div class="sync">
    <label>🔉 Синхрон</label>
    <button class="nudge" id="dminus">−100</button>
    <span class="val"><span id="dval">800</span> мс</span>
    <button class="nudge" id="dplus">+100</button>
  </div>
  <input type="range" id="delay" min="0" max="3000" step="50" value="800">
  <div class="hint">Звук отстаёт от картинки — увеличь. Опережает — уменьши.</div>

  <!-- Поиск -->
  <div class="sec">Поиск на YouTube</div>
  <div class="search">
    <input id="q2" type="search" placeholder="Запрос или ссылка YouTube…" enterkeyhint="search">
    <button class="btn" id="go">Найти</button>
  </div>
  <div id="results"></div>

  <details>
    <summary>📂 Файлы из папки Деки</summary>
    <div id="list"></div>
  </details>
</div>

<script src="mpegts.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const player = $('player'), status = $('status');
const delayEl = $('delay'), dval = $('dval'), qEl = $('q');

let src = null, title = '', mp = null, wakeLock = null, reloadTimer = null;

// ── запоминание настроек ──
const LS = window.localStorage;
delayEl.value = LS.getItem('dc_delay') || '800';
dval.textContent = delayEl.value;
if (LS.getItem('dc_q') !== null) qEl.value = LS.getItem('dc_q');

const fmt = (s) => {
  if (s == null || isNaN(s)) return '';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  return (h?h+':':'') + (h?String(m).padStart(2,'0'):m) + ':' + String(x).padStart(2,'0');
};
const setStatus = (txt, busy) => { status.innerHTML = (busy ? '<span class="spin"></span>' : '') + txt; };
const looksLikeUrl = (s) => /^https?:\/\//i.test(s) || /youtu\.?be/i.test(s);

function streamUrl() {
  let q = 'delay=' + delayEl.value + '&q=' + qEl.value;
  if (src.url) q += '&url=' + encodeURIComponent(src.url);
  else q += '&file=' + encodeURIComponent(src.file);
  return '/stream?' + q;
}

// ── экран не гаснет ──
async function keepAwake() {
  try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
async function releaseAwake() { try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !player.paused) keepAwake(); });
player.addEventListener('play', keepAwake);
player.addEventListener('pause', releaseAwake);

function playSource(s, t) {
  src = s; title = t || (s.url ? 'ссылку' : s.file);
  setStatus('Загрузка: ' + escapeHtml(title), true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (mp) { mp.destroy(); mp = null; }
  if (!window.mpegts || !mpegts.isSupported()) { setStatus('Нужен Chrome на Android.'); return; }
  mp = mpegts.createPlayer(
    { type: 'mpegts', isLive: true, url: streamUrl() },
    {                                   // низкая задержка на телефоне
      isLive: true,
      enableStashBuffer: false,
      stashInitialSize: 128,
      liveBufferLatencyChasing: true,
      liveBufferLatencyMaxLatency: 1.2,
      liveBufferLatencyMinRemain: 0.3,
      lazyLoad: false,
    });
  mp.attachMediaElement(player);
  mp.on(mpegts.Events.ERROR, () => setStatus('Ошибка потока. Проверь ссылку / yt-dlp на Деке.'));
  mp.load();
  mp.play().then(() => { setStatus('▶ ' + escapeHtml(title)); keepAwake(); }).catch(()=>{});
}

// перезапуск потока с небольшой задержкой (чтобы частые нажатия не плодили потоки)
function reloadSoon() {
  if (!src) return;
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => playSource(src, title), 350);
}
function setDelay(v) {
  v = Math.max(0, Math.min(3000, v));
  delayEl.value = v; dval.textContent = v; LS.setItem('dc_delay', v);
}

// ── синхрон ──
$('dminus').onclick = () => { setDelay(+delayEl.value - 100); reloadSoon(); };
$('dplus').onclick  = () => { setDelay(+delayEl.value + 100); reloadSoon(); };
delayEl.addEventListener('input', () => { dval.textContent = delayEl.value; LS.setItem('dc_delay', delayEl.value); });
delayEl.addEventListener('change', reloadSoon);
qEl.addEventListener('change', () => { LS.setItem('dc_q', qEl.value); reloadSoon(); });

// поиск / ссылка
$('go').onclick = onSubmit;
$('q2').addEventListener('keydown', (e) => { if (e.key === 'Enter') onSubmit(); });
function onSubmit() {
  const v = $('q2').value.trim();
  if (!v) return;
  if (looksLikeUrl(v)) { playSource({ url: v }); $('results').innerHTML = ''; }
  else doSearch(v);
}

async function doSearch(q) {
  setStatus('Ищу: ' + escapeHtml(q) + ' …', true);
  $('go').disabled = true;
  $('results').innerHTML = '';
  try {
    const j = await (await fetch('/search?q=' + encodeURIComponent(q))).json();
    if (j.error) { setStatus('Поиск: ' + escapeHtml(j.error)); return; }
    setStatus('Найдено: ' + j.results.length);
    const box = $('results');
    for (const v of j.results) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<img src="' + v.thumb + '" loading="lazy">' +
        '<div class="meta"><div class="t">' + escapeHtml(v.title) + '</div>' +
        '<div class="c">' + escapeHtml(v.channel || '') + (v.duration ? ' · ' + fmt(v.duration) : '') + '</div></div>';
      el.onclick = () => playSource({ url: 'https://www.youtube.com/watch?v=' + v.id }, v.title);
      box.appendChild(el);
    }
  } catch (e) { setStatus('Не удалось выполнить поиск.'); }
  finally { $('go').disabled = false; }
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadList() {
  try {
    const j = await (await fetch('/list')).json();
    const box = $('list');
    if (!j.videos.length) { box.innerHTML = '<div class="hint">Папка ~/Videos пуста.</div>'; return; }
    for (const name of j.videos) {
      const b = document.createElement('div');
      b.className = 'card'; b.style.padding = '12px';
      b.innerHTML = '<div class="meta"><div class="t">🎬 ' + escapeHtml(name) + '</div></div>';
      b.onclick = () => playSource({ file: name }, name);
      box.appendChild(b);
    }
  } catch (e) {}
}
loadList();
</script>
</body>
</html>
