<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeckCast</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f17; color: #e8eef7; font-family: system-ui, sans-serif; }
  header { padding: 13px 16px; font-weight: 600; font-size: 17px; background: #131a26;
           position: sticky; top: 0; z-index: 5; }
  .wrap { padding: 10px 14px 32px; }
  video { width: 100%; background: #000; border-radius: 12px; display: block; }

  .bar { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
  .pbtn { background: #1b2536; border: 1px solid #283549; color: #e8eef7;
          width: 46px; height: 46px; border-radius: 50%; font-size: 17px; flex: none; }
  .pbtn:active { background: #243248; }
  .pbtn.main { background: #2563eb; border: none; width: 54px; height: 54px; font-size: 20px; }
  .seek { flex: 1; }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .75; min-width: 96px; text-align: right; }

  input[type=range] { width: 100%; accent-color: #2563eb; }
  .ctl { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .ctl label { font-size: 12px; opacity: .7; min-width: 78px; }

  .search { display: flex; gap: 8px; margin: 6px 0; }
  .search input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #283549;
                  background: #0e1622; color: #e8eef7; font-size: 15px; }
  .btn { background: #2563eb; border: none; color: #fff; padding: 12px 16px;
         border-radius: 10px; font-size: 15px; font-weight: 600; flex: none; }
  .btn:active { background: #1d4ed8; }

  .card { display: flex; gap: 10px; padding: 8px; border-radius: 10px; background: #141d2b;
          border: 1px solid #1f2a3c; margin-bottom: 8px; align-items: center; }
  .card:active { background: #1b2740; }
  .card img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background:#000; }
  .card .meta { min-width: 0; }
  .card .t { font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
             -webkit-box-orient: vertical; overflow: hidden; }
  .card .c { font-size: 12px; opacity: .6; margin-top: 3px; }

  .sec { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; opacity: .5; margin: 18px 0 8px; }
  .hint { opacity: .55; font-size: 12px; margin-top: 8px; }
  #status { font-size: 13px; opacity: .85; margin: 6px 0; min-height: 18px; }
  details summary { cursor: pointer; opacity: .7; font-size: 13px; margin: 6px 0; }

  /* Полноэкранный режим */
  #stage:fullscreen { background: #000; display: flex; flex-direction: column;
                      justify-content: center; padding: 0; }
  #stage:fullscreen video { flex: 1; min-height: 0; height: auto; border-radius: 0; object-fit: contain; }
  #stage:fullscreen .bar { margin: 0; padding: 6px 16px; }
  #stage:fullscreen .seek { padding: 0 16px; }
  #stage:fullscreen .ctl { padding: 4px 16px 10px; }
</style>
</head>
<body>
<header>📺 DeckCast — пульт второго экрана</header>
<div class="wrap">

  <div id="stage">
    <video id="player" playsinline muted></video>

    <!-- Пульт -->
    <div class="bar">
      <button class="pbtn" id="back">⏪</button>
      <button class="pbtn main" id="play">▶</button>
      <button class="pbtn" id="fwd">⏩</button>
      <span class="time"><span id="cur">0:00</span> / <span id="dur">--:--</span></span>
      <button class="pbtn" id="fs" title="На весь экран">⛶</button>
    </div>
    <input type="range" id="seek" class="seek" min="0" max="1000" value="0">

    <div class="ctl">
      <label>🔊 Громкость</label>
      <input type="range" id="vol" min="0" max="100" value="100">
    </div>
  </div>
  <div id="status">Найди видео или вставь ссылку 👇</div>

  <!-- Поиск -->
  <div class="sec">Поиск на YouTube</div>
  <div class="search">
    <input id="q" type="search" placeholder="Что посмотреть…" enterkeyhint="search">
    <button class="btn" id="go">Найти</button>
  </div>
  <div class="search">
    <input id="url" type="url" inputmode="url" placeholder="…или вставь ссылку YouTube">
    <button class="btn" id="playUrl">▶</button>
  </div>
  <div id="results"></div>

  <details>
    <summary>⚙️ Синхрон звука и файлы на Деке</summary>
    <div class="ctl">
      <label>Синхрон: <span id="dval">1500</span> мс</label>
      <input type="range" id="delay" min="0" max="4000" step="100" value="1500">
    </div>
    <div class="sec">Файлы из папки Деки</div>
    <div id="list"></div>
  </details>

  <div class="hint">Звук идёт в наушники Деки, картинка — здесь. Перемотка/пауза/громкость
  управляют тем, что играет.</div>
</div>

<script src="mpegts.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const player = $('player'), status = $('status');
const seekEl = $('seek'), curEl = $('cur'), durEl = $('dur');
const volEl = $('vol'), delayEl = $('delay'), dval = $('dval');

let src = null;        // { url } | { file }
let title = '';
let duration = null;   // секунды, если известно
let playing = false;
let basePos = 0;       // позиция (сек), с которой стартовал текущий поток
let mp = null;
let seeking = false;   // пользователь тащит ползунок

const fmt = (s) => {
  if (s == null || isNaN(s)) return '--:--';
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  const mm = (h?String(m).padStart(2,'0'):m);
  return (h?h+':':'') + mm + ':' + String(x).padStart(2,'0');
};
const posNow = () => playing ? basePos + (player.currentTime || 0) : basePos;

function buildUrl() {
  let q = 'delay=' + delayEl.value + '&vol=' + (volEl.value/100) + '&ss=' + basePos.toFixed(1);
  if (src.url) q += '&url=' + encodeURIComponent(src.url);
  else q += '&file=' + encodeURIComponent(src.file);
  return '/stream?' + q;
}

function startStream() {
  if (mp) { mp.destroy(); mp = null; }
  if (!window.mpegts || !mpegts.isSupported()) {
    status.textContent = 'Нужен Chrome на Android.'; return;
  }
  mp = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: buildUrl() },
                           { liveBufferLatencyChasing: true, liveSync: true });
  mp.attachMediaElement(player);
  mp.on(mpegts.Events.ERROR, () => status.textContent = 'Ошибка потока. Проверь ссылку / yt-dlp на Деке.');
  mp.load();
  mp.play().then(() => { playing = true; setPlayIcon(); status.textContent = '▶ ' + title; }).catch(()=>{});
}

function play(fromPos) {
  if (!src) return;
  if (fromPos != null) basePos = fromPos;
  playing = true; setPlayIcon();
  startStream();
}
function pause() {
  basePos = posNow();
  playing = false; setPlayIcon();
  if (mp) { mp.destroy(); mp = null; }   // глушим и звук на Деке
  player.pause();
}
function togglePlay() { playing ? pause() : play(); }
function seekTo(t) {
  t = Math.max(0, duration ? Math.min(t, duration) : t);
  if (playing) play(t); else { basePos = t; updateUI(); }
}
function setPlayIcon() { $('play').textContent = playing ? '⏸' : '▶'; }

function updateUI() {
  const p = posNow();
  curEl.textContent = fmt(p);
  durEl.textContent = fmt(duration);
  if (!seeking) {
    seekEl.max = duration ? Math.floor(duration) : 1000;
    seekEl.value = Math.floor(p);
  }
}
setInterval(() => { if (src) updateUI(); }, 500);

// выбор источника
function selectSource(s, t, dur) {
  src = s; title = t || (s.url ? 'ссылка' : s.file); duration = dur ?? null;
  basePos = 0; status.textContent = 'Загрузка: ' + title;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  play(0);
  if (s.url && duration == null) fetchInfo(s.url);
}
async function fetchInfo(url) {
  try {
    const r = await fetch('/info?url=' + encodeURIComponent(url));
    const j = await r.json();
    if (j.duration) { duration = j.duration; updateUI(); }
    if (j.title) { title = j.title; }
  } catch (e) {}
}

// ── события пульта ──
$('play').onclick = togglePlay;
$('back').onclick = () => seekTo(posNow() - 15);
$('fwd').onclick  = () => seekTo(posNow() + 15);
$('fs').onclick = toggleFullscreen;
function toggleFullscreen() {
  const st = $('stage');
  if (document.fullscreenElement) {
    if (document.exitFullscreen) document.exitFullscreen();
    try { screen.orientation.unlock(); } catch (e) {}
  } else if (st.requestFullscreen) {
    st.requestFullscreen().then(() => {
      try { screen.orientation.lock('landscape'); } catch (e) {}
    }).catch(() => {});
  }
}
seekEl.addEventListener('input', () => { seeking = true; curEl.textContent = fmt(+seekEl.value); });
seekEl.addEventListener('change', () => { seeking = false; seekTo(+seekEl.value); });
volEl.addEventListener('change', () => { if (playing) play(posNow()); });
delayEl.addEventListener('input', () => dval.textContent = delayEl.value);
delayEl.addEventListener('change', () => { if (playing) play(posNow()); });

// ── поиск / ссылка ──
$('go').onclick = doSearch;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
$('playUrl').onclick = () => {
  const u = $('url').value.trim();
  if (u) selectSource({ url: u });
};

async function doSearch() {
  const q = $('q').value.trim();
  if (!q) return;
  status.textContent = 'Ищу: ' + q + ' …';
  $('results').innerHTML = '';
  try {
    const r = await fetch('/search?q=' + encodeURIComponent(q));
    const j = await r.json();
    if (j.error) { status.textContent = 'Поиск: ' + j.error; return; }
    status.textContent = 'Найдено: ' + j.results.length;
    const box = $('results');
    for (const v of j.results) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<img src="' + v.thumb + '" loading="lazy">' +
        '<div class="meta"><div class="t">' + escapeHtml(v.title) + '</div>' +
        '<div class="c">' + escapeHtml(v.channel || '') +
        (v.duration ? ' · ' + fmt(v.duration) : '') + '</div></div>';
      el.onclick = () => selectSource({ url: 'https://www.youtube.com/watch?v=' + v.id }, v.title, v.duration);
      box.appendChild(el);
    }
  } catch (e) { status.textContent = 'Не удалось выполнить поиск.'; }
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// файлы из папки
async function loadList() {
  try {
    const j = await (await fetch('/list')).json();
    const box = $('list');
    if (!j.videos.length) { box.innerHTML = '<div class="hint">Папка ~/Videos пуста.</div>'; return; }
    for (const name of j.videos) {
      const b = document.createElement('div');
      b.className = 'card'; b.style.padding = '12px';
      b.innerHTML = '<div class="meta"><div class="t">🎬 ' + escapeHtml(name) + '</div></div>';
      b.onclick = () => selectSource({ file: name }, name);
      box.appendChild(b);
    }
  } catch (e) {}
}
loadList();
</script>
</body>
</html>
